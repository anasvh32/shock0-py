[project]
name = "shock101-py"
version = "0.1.0"
description = "echo_lite: a minimal Agent CLI for SHOCK 101"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_lite"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
